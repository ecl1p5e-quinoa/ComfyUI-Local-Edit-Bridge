[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-local-edit-bridge"
version = "0.1.0"
description = "A local manual semantic-editor round trip with mask-aware compositing"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Pillow>=10", "numpy>=1.26", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "aiohttp>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
